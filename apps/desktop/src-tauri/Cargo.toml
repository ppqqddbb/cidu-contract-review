[package]
name = "contract-review-desktop"
version = "0.1.0"
description = "Cidu contract review desktop client"
authors = ["Cidu"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[lib]
name = "contract_review_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
