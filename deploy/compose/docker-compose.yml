name: contract-review

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contract_review
      POSTGRES_USER: contract_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - contract_review_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_review -d contract_review"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contract_review_pgdata:
