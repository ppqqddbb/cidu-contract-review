[project]
name = "contract-review-platform"
version = "0.1.0"
description = "标准合同AI预审与法务复核助手"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.1,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<12",
  "pypdfium2>=4.30,<5",
  "pymupdf>=1.26,<2",
  "pydantic-settings>=2.8,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pywin32>=311; sys_platform == 'win32'",
  "rapidfuzz>=3.14,<4",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pyinstaller>=6.12,<7",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/worker/tests", "tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["database/migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
